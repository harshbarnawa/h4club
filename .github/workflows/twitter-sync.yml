name: Sync X posts to blog

# Runs every 15 minutes (for fast testing). To go to hourly, change the cron
# below to:   - cron: "23 * * * *"
on:
  schedule:
    - cron: "0 0 * * 0"  
  workflow_dispatch:

# Never let two sync runs race — one in flight at a time.
concurrency:
  group: x-blog-sync
  cancel-in-progress: false

permissions:
  contents: write # so the bot can commit and push posts.json

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync script
        env:
          # Your handle is not sensitive, so it lives here directly — no
          # secret needed for the free path.
          X_USERNAME: harshbarnawa
          # Optional: for the reliable official X API, add a repo secret named
          # X_BEARER_TOKEN and the script switches to it automatically.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          POSTS_FILE: src/data/posts.json
          MAX_POSTS: 5
        run: node scripts/sync-twitter.js

      # The script only writes posts.json when there is a new post, so an empty
      # diff here means "nothing to publish" and we skip the commit entirely.
      - name: Detect changes
        id: changes
        run: |
          if git diff --exit-code --quiet -- src/data/posts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push new posts
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/posts.json
          git commit -m "chore(blog): sync latest posts from X"
          git push
